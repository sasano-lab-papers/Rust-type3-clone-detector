[package]
name = "rust_extractor"
version = "0.1.0"
edition = "2024"

[dependencies]
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
prettyplease = "0.2"
rustc_lexer = "0.1"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1"
